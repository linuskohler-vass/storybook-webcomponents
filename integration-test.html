<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liko Components - Integration Test</title>
  <link rel="stylesheet" href="./dist/styles.css">
  <script type="module" src="./dist/likocard.js"></script>
  <script type="module" src="./dist/zvveticketcard.js"></script>
  <style>
  </style>
</head>
<body>
  <h1>Liko Web Components - Integration Test</h1>
  <p>This page demonstrates the Liko web components using the built distribution files.</p>
  <div style="display: flex; gap: 20px; padding: 20px;">
    <liko-card
      heading="Mountain Retreat"
      text="Escape to the serene mountains and enjoy breathtaking views with fresh alpine air."
      image-src="https://placehold.co/600x400/4a564b/ffffff?text=Mountains"
      image-alt="Mountain landscape"
      button-label="Book Now"
    ></liko-card>
    <liko-card
      heading="Ocean Breeze"
      text="Relax by the coast with the soothing sound of waves and golden sunsets."
      image-src="https://placehold.co/600x400/627663/ffffff?text=Ocean"
      image-alt="Ocean view"
      button-label="Explore"
    ></liko-card>
    <liko-card
      heading="Forest Walk"
      text="Discover hidden trails through ancient forests and reconnect with nature."
      image-src="https://placehold.co/600x400/7d937e/ffffff?text=Forest"
      image-alt="Forest path"
      button-label="Enjoy"
    ></liko-card>
  </div>
  <section style="max-width: 760px; margin: 40px 20px;">
    <h2>ZVV ETicketCard</h2>
    <zvv-eticket-card
      heading="Gültige E-Tickets"
      subtitle="Aktive Tickets anzeigen"
      ticket-data='{
        "passengerName": "Satoshi Nakamoto",
        "provider": "Zürcher Verkehrsverbund",
        "product": "ZVV Einzelbillett",
        "zones": ["Zone 143", "Zone 144"],
        "travelClass": "2. Klasse, Vollpreis",
        "validity": "09.09.2025 16:36 – 09.09.2025 17:36",
        "receipt": {
          "label": "Kaufbeleg",
          "number": "1428757139"
        },
        "actions": {
          "refundLabel": "Ticket erstatten",
          "downloadLabel": "Ticket herunterladen"
        },
        "qrCode": {
          "src": "https://api.qrserver.com/v1/create-qr-code/?size=224x224&amp;data=ZVV-1428757139",
          "alt": "QR-Code für das ZVV Einzelbillett"
        }
      }'
    ></zvv-eticket-card>
  </section>
</body>
</html>
